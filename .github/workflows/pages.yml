name: Test and deploy (website + server)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m flowforge eval

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tools/build_site.py site
        env:
          FLOWFORGE_API_URL: ${{ vars.FLOWFORGE_API_URL }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # deploy-pages sometimes looks for the artifact before GitHub has indexed it ("Found 0 artifact(s)")
      - run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v5

  space:
    # Deploys the server (FastAPI + Ollama) to the Hugging Face Space named in vars.HF_SPACE.
    needs: test
    if: ${{ vars.HF_SPACE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "huggingface_hub>=0.30"
      - run: python tools/build_space.py build/space
      - name: Upload to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.create_repo(os.environ["HF_SPACE"], repo_type="space", space_sdk="docker", exist_ok=True)
          api.upload_folder(folder_path="build/space", repo_id=os.environ["HF_SPACE"], repo_type="space",
                            commit_message=f"Deploy {os.environ.get('GITHUB_SHA', '')[:7]} from GitHub",
                            delete_patterns=["*"])
          print("Deployed to https://huggingface.co/spaces/" + os.environ["HF_SPACE"])
          PY
